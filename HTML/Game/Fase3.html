<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fase 3 - Multiplicando no Oceano</title>

    <link rel="stylesheet" href="/CSS/styleFase3.css">

</head>


<body>

    <div id="intro">

    <img src="/images/introfase3.png" alt="Introdução da fase">

</div>

    <main class="game-container">

        <!-- Título -->
        <h1>Fase 3 – Multiplicando no Oceano</h1>

        <!-- Subtítulo -->
        <p class="subtitle">
            Acerte a conta e o personagem pula para a próxima plataforma!
        </p>


        <!-- Informações do jogo -->
        <div class="stats">

            <div class="stat">
                ⭐ Acertos: <span id="hits">0</span>
            </div>

            <div class="stat">
                🔄 Tentativas erradas: <span id="errors">0</span>
            </div>

            <div class="stat">
                🏁 Plataforma <span id="currentPlatform">1</span> de 5
            </div>

        </div>


        <!-- Cenário -->
        <section class="scene">


            <!-- Plataforma inicial -->
            <div class="platform current" id="platform0">
                Início
            </div>


            <!-- Plataforma 1 -->
            <div class="platform" id="platform1">
                ?
            </div>


            <!-- Plataforma 2 -->
            <div class="platform" id="platform2">
                ?
            </div>


            <!-- Plataforma 3 -->
            <div class="platform" id="platform3">
                ?
            </div>


            <!-- Plataforma final -->
            <div class="platform" id="platform4">
                Chegada!
            </div>


            <!-- Personagem -->
            <div class="character" id="character">

                <img
                    src="/images/Personagem.png"
                    alt="Personagem"
                >

            </div>


        </section>


        <!-- Área da pergunta -->
        <section class="question-panel">

            <h2 id="question">
                Quanto é 18 X 5?
            </h2>


            <!-- Respostas -->
            <div class="answers">

                <button class="answer-btn">
                    12
                </button>

                <button class="answer-btn">
                    13
                </button>

                <button class="answer-btn">
                    14
                </button>

                <div id="hintPopup" class="hint-popup">
                <div class="hint-content">
                <h3>💡 Dica!</h3>
                <p id="hintText"></p>
                <button id="closeHint">Entendi!</button>
                </div>
            </div>
            
            </div>


            <!-- Botão Próxima -->
            <button id="restartBtn">
            Ir para Fase 4
            </button>

        </section>

    </main>


    <script src="/JS/scriptFase3.js"></script>

</body>

</html>
