<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fase 2 - Subtraindo no Subsolo</title>

    <link rel="stylesheet" href="/CSS/StyleFase2.css">
    <link rel="stylesheet" href="/CSS/acessibilidade.css">

    <link rel="stylesheet" href="/CSS/audio-settings.css">
    <link rel="stylesheet" href="/CSS/instruction-audio.css">
    <link rel="stylesheet" href="/CSS/game-layout.css">
</head>


<body data-game-phase data-phase="2">
    <!-- Configurações -->
<div class="game-settings">

    <button
        id="settingsBtn" aria-expanded="false" aria-controls="settingsPanel"
        class="settings-btn"
        aria-label="Abrir configurações"
        title="Configurações"
    >
        ⚙️
    </button>

    <div
        id="settingsPanel"
        class="settings-panel"
    >
    <div class="brightness-option">
            <label for="brightnessSlider">Brilho</label>
        <div class="brightness-control">
            <input type="range" id="brightnessSlider" min="50" max="120" step="5" value="100" aria-label="Ajustar brilho do jogo">
            <span id="brightnessValue">100%</span>
        </div>
    </div>


        <div data-audio-settings></div>
        <section class="phase-accessibility" aria-labelledby="phaseAccessibilityTitle">
            <h3 id="phaseAccessibilityTitle">Acessibilidade</h3>
            <div class="phase-font-option">
                <span>Tamanho da fonte</span>
                <div class="phase-font-controls" role="group" aria-label="Tamanho da fonte">
                    <button type="button" id="diminuirFonte" aria-label="Diminuir fonte">A-</button>
                    <output id="fontePercentual" aria-live="polite">100%</output>
                    <button type="button" id="aumentarFonte" aria-label="Aumentar fonte">A+</button>
                </div>
            </div>
            <label class="phase-accessibility-toggle" for="altoContraste">
                <input type="checkbox" id="altoContraste">
                <span>Alto contraste</span>
            </label>
            <label class="phase-accessibility-toggle" for="feedbackVisualReforcado">
                <input type="checkbox" id="feedbackVisualReforcado">
                <span>Feedback visual refor&#231;ado</span>
            </label>
        </section>
    </div>

</div>
    <div id="intro">

    <img src="/images/introfase2.png" alt="Introdução da fase">

</div>

    <main class="game-container">

        <!-- Título -->
        <h1>Fase 2 – Subtraindo no Subsolo</h1>

        <!-- Subtítulo -->
        <p class="subtitle">
            Acerte a conta e o personagem pula para a próxima plataforma!
        </p>


        <!-- Informações do jogo -->
        
        <div class="instruction-audio">
            <button id="playInstructions" class="instruction-audio__button" type="button" aria-describedby="instructionAudioStatus">🔊 Ouvir instruções</button>
            <span id="instructionAudioStatus" class="instruction-audio__status" role="status" aria-live="polite"></span>
        </div>

        <div class="stats">

            <div class="stat">
                ⭐ Acertos: <span id="hits">0</span>
            </div>

            <div class="stat">
                🔄 Tentativas erradas: <span id="errors">0</span>
            </div>

            <div class="stat">
                🏁 Plataforma <span id="currentPlatform">1</span> de 5
            </div>

        </div>


        <!-- Cenário -->
        <section class="scene">


            <!-- Plataforma inicial -->
            <div class="platform current" id="platform0">
                Início
            </div>


            <!-- Plataforma 1 -->
            <div class="platform" id="platform1">
                ?
            </div>


            <!-- Plataforma 2 -->
            <div class="platform" id="platform2">
                ?
            </div>


            <!-- Plataforma 3 -->
            <div class="platform" id="platform3">
                ?
            </div>


            <!-- Plataforma final -->
            <div class="platform" id="platform4">
                Chegada!
            </div>


            <!-- Personagem -->
            <div class="character" id="character">

                <img
                    src="/images/Personagem.png"
                    alt="Personagem"
                >

            </div>


        </section>


        <!-- Área da pergunta -->
        <section class="question-panel">

            <h2 id="question" tabindex="-1" aria-live="polite" aria-atomic="true">Leia a situação e escolha uma resposta.</h2>


            <!-- Respostas -->
            <div class="answers">

                <button class="answer-btn">
                    12
                </button>

                <button class="answer-btn">
                    13
                </button>

                <button class="answer-btn">
                    14
                </button>

                
                <div id="hintPopup" class="hint-popup" role="dialog" aria-modal="true" aria-labelledby="hintTitle" aria-describedby="hintText" tabindex="-1" data-game-dialog>
                <div class="hint-content">
                    <h3 id="hintTitle">💡 Dica!</h3>
                <p id="hintText"></p>
                <button id="closeHint" data-dialog-close data-dialog-initial-focus>Entendi!</button>
                </div>
            </div>
            </div>
            <div id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>


            <!-- Botão Próxima -->
            <div class="botoes-navegacao">
                <button id="restartBtn">
                    Ir para Fase 3 <!-- texto varia por fase, já existente -->
                </button>

                <a class="back-menu" href="/menu">Voltar ao Menu</a>
            </div>

        </section>

    </main>

    <script src="/JS/config.js"></script>
    <script src="/JS/avatar.js"></script>
    <script src="/JS/audio.js"></script>
    <script src="/JS/instruction-audio.js"></script>
    <script src="/JS/problems.js"></script>
    <script src="/JS/game-session.js"></script>
    <script src="/JS/dialog-accessibility.js"></script>
    <script src="/JS/brightness.js"></script>
    <script src="/JS/acessibilidade.js"></script>
    <script src="/JS/scriptFase2.js"></script>
 
    <script src="/JS/game-layout.js"></script>
</body>

</html>
