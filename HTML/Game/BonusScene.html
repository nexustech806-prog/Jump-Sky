<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fase Bônus - Desafio Infinito</title>

    <link rel="stylesheet" href="/CSS/styleBonus.css">
</head>

<body>

    <main class="game-container">

        <h1>🚀 Fase Bônus – Desafio Infinito</h1>

        <p class="subtitle">
            Resolva as operações antes que o tempo acabe e tente chegar o mais longe possível!
        </p>

        <div class="stats">
            <div class="stat">❤️ Vidas: <span id="lives">3</span></div>
            <div class="stat">⭐ Pontos: <span id="score">0</span></div>
            <div class="stat">🏆 Recorde: <span id="highScore">0</span></div>
            <div class="stat">🧠 Questão: <span id="questionNumber">1</span></div>
            <div class="stat timer">⏱️ Tempo: <span id="timer">15</span>s</div>
        </div>

        <section class="scene" id="scene">

            <div class="scene-info">
                <span id="sceneName">🌍 Órbita da Terra</span>
            </div>

            <div class="platform current" id="platform0"></div>
            <div class="platform" id="platform1"></div>
            <div class="platform" id="platform2"></div>
            <div class="platform" id="platform3"></div>
            <div class="platform" id="platform4"></div>
            <div class="platform" id="platform5"></div>
            <div class="platform" id="platform6"></div>
            <div class="platform" id="platform7"></div>
            <div class="platform" id="platform8"></div>
            <div class="platform" id="platform9"></div>

            <div class="character" id="character">
                <img id="characterImage" src="/images/Personagem.png" alt="Personagem">
            </div>

        </section>

        <section class="question-panel">

            <h2 id="question">Preparando desafio...</h2>

            <div class="answers">
                <button class="answer-btn" type="button">?</button>
                <button class="answer-btn" type="button">?</button>
                <button class="answer-btn" type="button">?</button>
            </div>

            <div id="feedback"></div>
            <div id="recordMessage"></div>

            <!-- Opções exibidas somente quando o tempo acaba -->
            <div id="timeoutActions" class="timeout-actions">
                <button id="retryQuestionBtn" type="button">
                    🔄 Tentar novamente
                </button>

                <button id="nextQuestionBtn" type="button">
                    ➡️ Próxima questão
                </button>
            </div>

            <div id="gameOver" class="game-over">
                <h2>🚀 Fim do desafio!</h2>

                <p>
                    Você conseguiu
                    <span id="finalScore">0</span>
                    pontos!
                </p>

                <button id="playAgainBtn" type="button">
                    Jogar novamente
                </button>

                <button id="menuBtn">
                    Voltar ao menu
                </button>
            </div>

        </section>

    </main>

    <script src="/JS/config.js"></script>
    <script src="/JS/scriptBonus.js"></script>

</body>

</html>
