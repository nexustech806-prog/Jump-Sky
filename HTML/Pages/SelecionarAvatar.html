<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selecionar Avatar - Jump Sky</title>

    <link rel="stylesheet" href="../../CSS/SelecionarAvatar.css">
</head>

<body>

    <main class="avatar-container">

        <h1>Escolha seu avatar!</h1>
        <p>Escolha o personagem que vai acompanhar você nessa aventura.</p>

        <section class="avatares">

            <button class="avatar" data-avatar="personagem.png">
                <img src="../../images/Personagem.png" alt="Avatar 1">
            </button>

            <button class="avatar" data-avatar="personagem2.png">
                <img src="../../images/personagem2.png" alt="Avatar 2">
            </button>

            <button class="avatar" data-avatar="personagem3.png">
                <img src="../../images/personagem3.png" alt="Avatar 3">
            </button>

            <button class="avatar" data-avatar="personagem4.png">
                <img src="../../images/personagem4.png" alt="Avatar 4">
            </button>

        </section>

        <p id="mensagem">Selecione um avatar para continuar.</p>

        <button id="continuar" disabled>
            Continuar
        </button>

    </main>

    <script src="/JS/SelecionarAvatar.js"></script>

</body>
</html>
