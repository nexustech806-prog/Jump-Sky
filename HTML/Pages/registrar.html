<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar-se</title>
    <link rel="stylesheet" href="/CSS/Style.css">
    <link rel="stylesheet" href="/CSS/acessibilidade.css">
</head>
<body>
    <nav>
        <div class="Menu">
            <section class="Menu-Content">
                <Span class="Game-Title"><a href="/">Jump Sky</a></Span>
                <div class="Menu-Text">
                <span><a href="/somando-nas-nuvens">Jogar </a></span>
                <span><a href="/login"> Entrar</a> </span>
                <span> <a href="/registrar"> Registrar</a></span>
                </div>
            </section>
        </div>
    </nav>

    <div class="container-login-register">
        <section class="container-forms">
            <form onsubmit="createUser(event)">
                
                <div class="input-group">
                    <label>Crie um apelido</label>
                    <p id="apelidoEscolhido">Escolha um dos apelidos abaixo:</p>
                    <div id="nomesSugeridos"></div>
                    <span id="Dice_Name">🎲 Gerar novas opções</span>
                    <input type="hidden" id="login_reg" value="">
                </div>

                <div class="input-group">
                    <label>Crie uma senha</label>
                    <input type="password" id="password_reg" placeholder="Digite sua senha aqui">
                </div>
                <div class="input-group">
                    <label>Confirme sua senha</label>
                    <input type="password" id="confirm_password_reg" placeholder="Digite sua senha aqui">
                </div>
                <div class="btn-group">
                    <label>Aperte para se registrar</label>
                    <button type="submit" id="bttn_reg">Registrar-se</button>
                </div>

                <div class="link-group">
                    <p>Já é cadastrado?</p>
                    <a href="/login">Faça login aqui</a>
                </div>

            </form>
        </section>
    </div> 
    
    <script src="/JS/config.js"></script>
    <script src="/JS/audio.js"></script>
    <script src="/JS/acessibilidade.js"></script>
    <script src="/JS/register.js"></script>
</body>
</html>
