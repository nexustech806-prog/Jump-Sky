<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/CSS/Style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=casino" />
</head>
<body>
    <nav>
        <div class="Menu">
            <section class="Menu-Content">
                <Span class="Game-Title"><a href="/">Jump Sky</a></Span>
                <div class="Menu-Text">
                <span><a href="/fase1">Jogar </a></span>
                <span><a href="/login"> Entrar</a> </span>
                <span> <a href="/selecionar-avatar"> Registrar</a></span>
                </div>
            </section>
        </div>
    </nav>

    <div class="container-login-register">
        <section class="container-forms">
            <form onsubmit="createUser(event)">
                
                <div class="input-group">
                    <label>Crie um apelido</label>
                    <input type="text" id="login_reg" placeholder="Seu apelido">
                    <span class="text-dice">clique para sortear um nome<span id="Dice_Name">🎲</span></span>
                    <div id="nomesSugeridos" class="nomes-sugeridos"></div>
                </div>

                <div class="input-group">
                    <label>Crie uma senha</label>
                    <input type="password" id="password_reg" placeholder="Digite sua senha aqui">
                </div>
                <div class="input-group">
                    <label>Confirme sua senha</label>
                    <input type="password" id="confirm_password_reg" placeholder="Digite sua senha aqui">
                </div>
                <div class="btn-group">
                    <label>Aperte para se registrar</label>
                    <button type="submit" id="bttn_reg">Registrar-se</button>
                </div>

                <div class="link-group">
                    <p>Já é cadastrado?</p>
                    <a href="login.html">Faça login aqui</a>
                </div>

            </form>
        </section>
    </div>
    <script src="/JS/register.js"></script>
    <script src="/JS/config.js"></script>
</body>
</html>
