<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/CSS/Style.CSS">
</head>
<body>
    <nav>
        <div class="Menu">
            <section class="Menu-Content">
                <Span class="Game-Title"><a href="Index.Html">Jump Sky</a></Span>
                <div>
                <span><a href="/HTML/Game/FirstScene.html">Jogar </a></span>
                <span><a href="login.html"> Entrar</a> </span>
                <span> <a href="registrar.html"> Registrar</a></span>
                </div>
            </section>
        </div>
    </nav>

    <div class="container-login-register">
        <section class="container-forms">
            <form onsubmit="createUser(event)">
                
                <div class="input-group">
                    <label>Crie um apelido</label>
                    <input type="text" id="login_reg" placeholder="Crie um apelido">
                </div>

                <div class="input-group">
                    <label>Crie uma senha</label>
                    <input type="password" id="password_reg" placeholder="Digite sua senha aqui">
                </div>
                <div class="input-group">
                    <label>Confirme sua senha</label>
                    <input type="password" id="confirm_password_reg" placeholder="Digite sua senha aqui">
                </div>
                <div class="btn-group">
                    <label>Aperte para se registrar</label>
                    <button type="submit" id="bttn_reg">Registrar-se</button>
                </div>

                <div class="link-group">
                    <p>Já é cadastrado?</p>
                    <a href="login.html">Faça login aqui</a>
                </div>

            </form>
        </section>
    </div>
    <script src="/JS/register.js"></script>
</body>
</html>
