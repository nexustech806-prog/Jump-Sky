<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="/CSS/Style.css">
    <link rel="stylesheet" href="/CSS/acessibilidade.css">
</head>
<body>
    <nav>
        <div class="Menu">
            <section class="Menu-Content">
                <Span class="Game-Title"><a href="/">Jump Sky</a></Span>
                <div class="Menu-Text">
                <span><a href="/somando-nas-nuvens">Jogar </a></span>
                <span><a href="/login"> Entrar</a> </span>
                <span> <a href="/registrar"> Registrar</a></span>
                </div>
            </section>
        </div>
    </nav>

    <main class="menu-container">
    <div class="menu-card">
        <section class="game-floor" aria-label="Fases do jogo">
            <a class="card-floor" href="/somando-nas-nuvens" data-fase="1">
                <h3>Fase 1</h3>
                <p>Somando nas Nuvens</p>
            </a>
            <a class="card-floor" href="/subtraindo-no-subsolo" data-fase="2">
                <h3>Fase 2</h3>
                <p>Subtraindo no Subsolo</p>
            </a>
            <a class="card-floor" href="/multiplicando-no-oceano" data-fase="3">
                <h3>Fase 3</h3>
                <p>Multiplicando no Oceano</p>
            </a>
            <a class="card-floor" href="/dividindo-no-vulcao" data-fase="4">
                <h3>Fase 4</h3>
                <p>Dividindo no Vulcao</p>
            </a>
            <a class="card-floor" href="pulando-no-espaco" data-fase="5" data-slug="Bonus">
                <h3>Fase bonus</h3>
                <p>?</p>
            </a>
        </section>

        <section class="options" aria-label="Opções">
            <h2>Opções</h2>

            <div class="option-item">
                <label>Som</label>
                <button id="toggleSom">🔊</button>
            </div>

            <div class="option-item">
                <button id="sairBtn">Sair da conta</button>
            </div>
        </section>

        <section class="accessibility" aria-label="Acessibilidade">
    <h2>Acessibilidade</h2>

    <div class="option-item">
        <label for="fonteAmpliada">Tamanho da fonte</label>
        <div class="font-controls">
            <button type="button" id="diminuirFonte" aria-label="Diminuir fonte">A-</button>
            <span id="fontePercentual">100%</span>
            <button type="button" id="aumentarFonte" aria-label="Aumentar fonte">A+</button>
        </div>
    </div>

    <div class="option-item">
        <label for="altoContraste">Alto contraste</label>
        <input type="checkbox" id="altoContraste">
    </div>

    <div class="option-item">
        <label for="feedbackSonoro">Sons de acerto/erro</label>
        <input type="checkbox" id="feedbackSonoro" checked>
    </div>

    <div class="option-item">
        <label for="feedbackVisualReforcado">Feedback visual reforçado</label>
        <input type="checkbox" id="feedbackVisualReforcado">
    </div>
</section>

        <section class="instructions" aria-label="Instruções">
            <a href="/aprendendo-a-jogar">Tutorial</a>
        </section>
    </div>
</main>

    <script src="/JS/config.js"></script>
    <script src="/JS/audio.js"></script>
    <script src="/JS/acessibilidade.js"></script>
    <script src="/JS/menu.js"></script>

</body>
</html>
